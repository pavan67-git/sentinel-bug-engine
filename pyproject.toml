[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-bug-engine"
version = "0.1.0"
description = "Enterprise-grade multi-language AI bug and vulnerability detection engine with Joint Verification Engine (JVE)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "Flask>=2.3.0",
    "flask-cors>=4.0.0"
]

[project.scripts]
sentinel = "src.cli:main"
